name: Build misaka IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install signing utility
        run: brew install ldid

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -resolvePackageDependencies \
            -project misaka.xcodeproj \
            -scheme misaka \
            -derivedDataPath build/DerivedData \
            2>&1 | tee build/xcodebuild.log

      - name: Patch Runestone delegate availability
        shell: python
        run: |
          from pathlib import Path
          root = Path('build/DerivedData/SourcePackages/checkouts')
          files = list(root.glob('*/Sources/Runestone/TextView/SearchAndReplace/UITextSearchingHelper.swift'))
          if len(files) != 1:
              raise SystemExit(f'Expected one Runestone source file, found {len(files)}')
          path = files[0]
          text = path.read_text()
          old = 'extension UITextSearchingHelper: UIFindInteractionDelegate {'
          new = '@available(iOS 16, *)\n' + old
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('Runestone source changed; refusing an unverified patch')
              path.chmod(path.stat().st_mode | 0o200)
              path.write_text(text.replace(old, new, 1))

      - name: Build iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project misaka.xcodeproj \
            -scheme misaka \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -disableAutomaticPackageResolution \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee -a build/xcodebuild.log

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Debug-iphoneos/misaka.app
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP" build/Payload/misaka.app
          rm -rf build/Payload/misaka.app/_CodeSignature
          rm -f build/Payload/misaka.app/embedded.mobileprovision
          ldid -Sentitlements.plist build/Payload/misaka.app/misaka
          (cd build && zip -qry misaka.ipa Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: misakaReborn-IPA
          path: build/misaka.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misakaReborn-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
